syntax = "proto3";

package velony.conversation.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/conversation/gen/api/v1;apiv1";

// Provides conversation, participant, and message management operations.
service ConversationService {
  option (google.api.default_host) = "api.velony.app";

  // Retrieves a conversation by resource name.
  rpc GetConversation(GetConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      get: "/v1/{name=conversations/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists conversations for the currently authenticated user.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = {
      get: "/v1/conversations"
    };
  }

  // Retrieves multiple conversations by their resource names.
  rpc BatchGetConversations(BatchGetConversationsRequest) returns (BatchGetConversationsResponse) {
    option (google.api.http) = {
      get: "/v1/conversations:batchGet"
    };
  }

  // Creates a conversation.
  rpc CreateConversation(CreateConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/v1/conversations"
      body: "conversation"
    };
    option (google.api.method_signature) = "conversation";
  }

  // Updates a conversation.
  rpc UpdateConversation(UpdateConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      patch: "/v1/{conversation.name=conversations/*}"
      body : "conversation"
    };
    option (google.api.method_signature) = "conversation,update_mask";
  }

  // Deletes a conversation.
  rpc DeleteConversation(DeleteConversationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=conversations/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Joins a conversation.
  rpc JoinConversation(JoinConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/v1/{name=conversations/*}:join"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Leaves a conversation.
  rpc LeaveConversation(LeaveConversationRequest) returns (LeaveConversationResponse) {
    option (google.api.http) = {
      post: "/v1/{name=conversations/*}:leave"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves a conversation user by resource name.
  rpc GetConversationUser(GetConversationUserRequest) returns (ConversationUser) {
    option (google.api.http) = {
      get: "/v1/{name=conversations/*/users/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists users in a conversation.
  rpc ListConversationUsers(ListConversationUsersRequest) returns (ListConversationUsersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=conversations/*}/users"
    };
    option (google.api.method_signature) = "parent";
  }

  // Retrieves multiple conversation users by their resource names.
  rpc BatchGetConversationUsers(BatchGetConversationUsersRequest) returns (BatchGetConversationUsersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=conversations/*}/users:batchGet"
    };
  }

  // Adds a user to a conversation.
  rpc CreateConversationUser(CreateConversationUserRequest) returns (ConversationUser) {
    option (google.api.http) = {
      post: "/v1/{parent=conversations/*}/users"
      body: "conversation_user"
    };
    option (google.api.method_signature) = "parent,conversation_user";
  }

  // Removes a user from a conversation.
  rpc DeleteConversationUser(DeleteConversationUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=conversations/*/users/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Transfers conversation ownership to a user.
  rpc ElectConversationUser(ElectConversationUserRequest) returns (ConversationUser) {
    option (google.api.http) = {
      post: "/v1/{name=conversations/*/users/*}:elect"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Promotes a conversation user to admin.
  rpc PromoteConversationUser(PromoteConversationUserRequest) returns (ConversationUser) {
    option (google.api.http) = {
      post: "/v1/{name=conversations/*/users/*}:promote"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Demotes a conversation user to member.
  rpc DemoteConversationUser(DemoteConversationUserRequest) returns (ConversationUser) {
    option (google.api.http) = {
      post: "/v1/{name=conversations/*/users/*}:demote"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves a message by resource name.
  rpc GetMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {
      get: "/v1/{name=conversations/*/messages/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists messages in a conversation.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=conversations/*}/messages"
    };
    option (google.api.method_signature) = "parent";
  }

  // Retrieves multiple messages by their resource names.
  rpc BatchGetMessages(BatchGetMessagesRequest) returns (BatchGetMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=conversations/*}/messages:batchGet"
    };
  }

  // Creates a message in a conversation.
  rpc CreateMessage(CreateMessageRequest) returns (Message) {
    option (google.api.http) = {
      post: "/v1/{parent=conversations/*}/messages"
      body: "message"
    };
    option (google.api.method_signature) = "parent,message";
  }

  // Updates a message.
  rpc UpdateMessage(UpdateMessageRequest) returns (Message) {
    option (google.api.http) = {
      patch: "/v1/{message.name=conversations/*/messages/*}"
      body : "message"
    };
    option (google.api.method_signature) = "message,update_mask";
  }

  // Deletes a message.
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=conversations/*/messages/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

message Conversation {
  option (google.api.resource) = {
    type    : "api.velony.app/Conversation"
    pattern : "conversations/{conversation}"
    singular: "conversation"
    plural  : "conversations"
  };

  // The resource name of the conversation.
  //
  // Format: `conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The conversation title, 1–100 characters long.
  string title = 2 [
    (google.api.field_behavior) = REQUIRED
  ];

  // The conversation description, up to 1000 characters.
  string description = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // The most recent message in the conversation, if any.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  optional string last_message = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
    type: "api.velony.app/Message"
    }
  ];

  // The time when the conversation was created.
  google.protobuf.Timestamp create_time = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The time when the conversation was last updated.
  google.protobuf.Timestamp update_time = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message ConversationUser {
  enum Role {
    ROLE_UNSPECIFIED = 0;

    OWNER  = 1;
    ADMIN  = 2;
    MEMBER = 3;
  }

  option (google.api.resource) = {
    type    : "api.velony.app/ConversationUser"
    pattern : "conversations/{conversation}/users/{conversation_user}"
    singular: "conversationUser"
    plural  : "conversationUsers"
  };

  // The resource name of the conversation user.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The user associated with the conversation.
  //
  // Format: `users/{user}`
  string user = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
    type: "api.velony.app/User"
    }
  ];

  // The user's role in the conversation.
  Role role = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The time when the user joined the conversation.
  google.protobuf.Timestamp create_time = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The time when the user's role was last changed.
  google.protobuf.Timestamp update_time = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message Message {
  option (google.api.resource) = {
    type    : "api.velony.app/Message"
    pattern : "conversations/{conversation}/messages/{message}"
    singular: "message"
    plural  : "messages"
  };

  // The resource name of the message.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The author of the message, if they still exist.
  //
  // Format: `users/{user}`
  optional string user = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
    type: "api.velony.app/User"
    }
  ];

  // The message content, up to 65536 characters.
  string content = 3 [
    (google.api.field_behavior) = REQUIRED
  ];

  // The time when the message was sent.
  google.protobuf.Timestamp create_time = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The time when the message was last edited.
  google.protobuf.Timestamp update_time = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message GetConversationRequest {
  // The conversation to retrieve.
  //
  // Format: `conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];
}

message ListConversationsRequest {
  // The maximum number of conversations to return.
  // Defaults to 20; values above 100 are treated as 100.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // A page token from a previous `ListConversations` call.
  // All other request parameters must match that call.
  string page_token = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ListConversationsResponse {
  // The conversations of the currently authenticated user.
  repeated Conversation conversations = 1;

  // The token for the next page, if any.
  string next_page_token = 2;
}

message BatchGetConversationsRequest {
  // The conversations to retrieve.
  // A maximum of `100` conversations can be retrieved in a batch.
  //
  // Format: `conversations/{conversation}`
  repeated string names = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];
}

message BatchGetConversationsResponse {
  // The requested conversations.
  repeated Conversation conversations = 1;
}

message CreateConversationRequest {
  // The conversation to create.
  Conversation conversation = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message UpdateConversationRequest {
  // The conversation to update, identified by its `name`.
  //
  // Format: `conversations/{conversation}`
  Conversation conversation = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message DeleteConversationRequest {
  // The conversation to delete.
  //
  // Format: `conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];
}

message JoinConversationRequest {
  // The conversation to join.
  //
  // Format: `conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];
}

message LeaveConversationRequest {
  // The conversation to leave.
  //
  // Format: `conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];
}

message LeaveConversationResponse {}

message GetConversationUserRequest {
  // The conversation user to retrieve.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message ListConversationUsersRequest {
  // The conversation whose users are being listed.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The maximum number of conversation users to return.
  // Defaults to 20; values above 100 are treated as 100.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // A page token from a previous `ListConversationUsers` call.
  // All other request parameters must match that call.
  string page_token = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ListConversationUsersResponse {
  // The conversation users in the specified conversation.
  repeated ConversationUser conversation_users = 1;

  // The token for the next page, if any.
  string next_page_token = 2;
}

message BatchGetConversationUsersRequest {
  // The conversation containing the users to retrieve.
  // All `names` must belong to this conversation.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The conversation users to retrieve.
  // A maximum of `100` conversation users can be retrieved in a batch.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message BatchGetConversationUsersResponse {
  // The requested conversation users.
  repeated ConversationUser conversation_users = 1;
}

message CreateConversationUserRequest {
  // The conversation to add a user to.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The conversation user to add.
  ConversationUser conversation_user = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message DeleteConversationUserRequest {
  // The conversation user to remove.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message ElectConversationUserRequest {
  // The conversation user to elect as owner.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message PromoteConversationUserRequest {
  // The conversation user to promote to admin.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message DemoteConversationUserRequest {
  // The conversation user to demote to member.
  //
  // Format: `conversations/{conversation}/users/{conversation_user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/ConversationUser"
    }
  ];
}

message GetMessageRequest {
  // The message to retrieve.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Message"
    }
  ];
}

message ListMessagesRequest {
  // The conversation whose messages are being listed.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The maximum number of messages to return.
  // Defaults to 50; values above 100 are treated as 100.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // A page token from a previous `ListMessages` call.
  // All other request parameters must match that call.
  string page_token = 3 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ListMessagesResponse {
  // The messages in the specified conversation.
  repeated Message messages = 1;

  // The token for the next page, if any.
  string next_page_token = 2;
}

message BatchGetMessagesRequest {
  // The conversation containing the messages to retrieve.
  // All `names` must belong to this conversation.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The messages to retrieve.
  // A maximum of `100` messages can be retrieved in a batch.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Message"
    }
  ];
}

message BatchGetMessagesResponse {
  // The requested messages.
  repeated Message messages = 1;
}

message CreateMessageRequest {
  // The conversation to create the message in.
  //
  // Format: `conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Conversation"
    }
  ];

  // The message to create.
  Message message = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message UpdateMessageRequest {
  // The message to update, identified by its `name`.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  Message message = 1 [
    (google.api.field_behavior) = REQUIRED
  ];

  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message DeleteMessageRequest {
  // The message to delete.
  //
  // Format: `conversations/{conversation}/messages/{message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
    type: "api.velony.app/Message"
    }
  ];
}